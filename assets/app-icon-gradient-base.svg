<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">App icon gradient base</title>
  <desc id="description">A rounded square with the App Stylr charcoal-to-mint gradient and no foreground glyph.</desc>
  <defs>
    <linearGradient id="icon-gradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0E0E10" />
      <stop offset="0.72" stop-color="#202023" />
      <stop offset="1" stop-color="#A9CEC2" />
    </linearGradient>
  </defs>
  <rect x="92" y="92" width="840" height="840" rx="190" fill="url(#icon-gradient)" />
</svg>
